name: Run KOOK Game Night Bot

on:
  push:
    branches: [main]
    paths:
      - "src/coop_night_picker/**"
      - "scripts/run_kook_bot.py"
      - ".github/workflows/kook_bot.yml"
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: "Continuous bot runtime hours (max 5.5 hours per run)"
        required: false
        default: "5"
  schedule:
    # Fire every hour. Each run lasts ~5h17m; with the queueing concurrency group
    # below, the next pending run starts immediately after the current one ends,
    # so the bot stays online 24/7 even when GitHub delays scheduled triggers.
    - cron: "0 * * * *"

permissions:
  contents: write
  models: read

concurrency:
  # Queue hourly schedule runs so the bot stays online 24/7,
  # but let code pushes / manual dispatches take over immediately.
  group: kook-bot-runner
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  kook-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Show startup context
        run: |
          python -c "import datetime;print('start UTC', datetime.datetime.now(datetime.timezone.utc).isoformat())"
          git log --oneline -1
      - name: Compute runtime budget
        id: runtime
        env:
          INPUT_HOURS: ${{ github.event.inputs.runtime_hours }}
        run: |
          python - <<'PY'
          import os
          raw = (os.getenv("INPUT_HOURS") or "").strip()
          try:
              secs = int(max(60.0, min(5.28, float(raw)) * 3600.0)) if raw else 19000
          except ValueError:
              secs = 19000
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"seconds={secs}\n")
          print(f"KOOK_MAX_RUNTIME_SECONDS={secs}")
          PY
      - name: Run KOOK Bot
        env:
          KOOK_TOKEN: ${{ secrets.KOOK_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          KOOK_MAX_RUNTIME_SECONDS: ${{ steps.runtime.outputs.seconds }}
          KOOK_MAX_MESSAGE_AGE_SECONDS: "900"
        run: python scripts/run_kook_bot.py
