name: Run KOOK Game Night Bot

on:
  push:
    branches: [main]
    paths:
      - "src/coop_night_picker/**"
      - "scripts/run_kook_bot.py"
      - ".github/workflows/kook_bot.yml"
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: "Continuous bot runtime hours (max 5.5 hours per run)"
        required: false
        default: "5"
  schedule:
    # Fire every hour. Each run lasts ~5h17m; with the queueing concurrency group
    # below, the next pending run starts immediately after the current one ends,
    # so the bot stays online 24/7 even when GitHub delays scheduled triggers.
    - cron: "0 * * * *"

permissions:
  contents: read
  models: read

concurrency:
  # Queue instead of cancel: killing the in-flight run would take the bot offline.
  group: kook-bot-runner
  cancel-in-progress: false

jobs:
  kook-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Show startup context
        run: |
          python -c "import datetime;print('start UTC', datetime.datetime.utcnow().isoformat())"
          git log --oneline -1
      - name: Run KOOK Bot
        env:
          KOOK_TOKEN: ${{ secrets.KOOK_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          KOOK_MAX_RUNTIME_SECONDS: "19000"
          KOOK_MAX_MESSAGE_AGE_SECONDS: "900"
        run: python scripts/run_kook_bot.py
