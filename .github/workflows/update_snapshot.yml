name: Update game snapshot

on:
  push:
    branches:
      - main
      - implementation
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/update_snapshot.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Build curator-driven snapshot with reviews
        run: python scripts/build_snapshot.py --limit 150 --with-reviews
      - name: Verify snapshot
        run: python scripts/verify_snapshot.py
      - name: Commit changed snapshot
        run: |
          git add data/games.sqlite
          if git diff --staged --quiet -- data/games.sqlite; then
            echo "Snapshot unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(data): update curator-driven game snapshot [skip ci]"
            git pull --rebase -X theirs origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
