name: Update game snapshot

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Build snapshot
        run: python scripts/build_snapshot.py --limit 300 --with-reviews
      - name: Verify snapshot
        run: python scripts/verify_snapshot.py
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/games.sqlite; then
            echo "Snapshot unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/games.sqlite
            git commit -m "chore(data): update game snapshot"
            git push
          fi
