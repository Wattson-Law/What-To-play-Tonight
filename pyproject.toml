[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coop-night-picker"
version = "0.1.0"
description = "Co-op game night picker"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.9,<2", "httpx", "beautifulsoup4", "lxml", "pydantic"]

[project.scripts]
coop-night-picker-probe = "coop_night_picker.probe:main"
coop-night-picker = "coop_night_picker.server:main"

[tool.setuptools.packages.find]
where = ["src"]
